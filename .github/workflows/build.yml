name: Build and calculation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build LoanPaymentCalculator.slnx --configuration Release
      - run: dotnet run --project tests/LoanPaymentCalculator.Checks --configuration Release --no-build
      - run: dotnet publish src/LoanPaymentCalculator.Demo --configuration Release --no-restore --output artifacts/demo
      - uses: actions/upload-artifact@v4
        with:
          name: loan-studio-demo
          path: artifacts/demo
